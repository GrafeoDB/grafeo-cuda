[workspace]
resolver = "2"
members = [
    "crates/grafeo-cuda-core",
    "crates/grafeo-cuda-algos",
    "crates/bindings/python",
    "xtask",
]
default-members = [
    "crates/grafeo-cuda-core",
    "crates/grafeo-cuda-algos",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"
repository = "https://github.com/GrafeoDB/grafeo-cuda"
authors = ["S.T. Grond"]
description = "GPU-accelerated graph algorithms for the Grafeo graph database."

[workspace.dependencies]
# Internal crates
grafeo-cuda-core = { path = "crates/grafeo-cuda-core", version = "0.1.1" }
grafeo-cuda-algos = { path = "crates/grafeo-cuda-algos", version = "0.1.1" }

# Grafeo implementation crates, pinned exactly.
#
# The stable `grafeo` facade does not (yet) re-export what this workspace
# needs: `grafeo_core::graph::Direction` (required to enumerate edges through
# `GraphStore::edges_from`) and the CPU reference algorithms in
# `grafeo_adapters::plugins::algorithms` (used by the correctness tests).
# Implementation crates may change their API in any release, so they are pinned
# with `=` and bumped deliberately together. To build against a local Grafeo
# checkout, uncomment the `[patch.crates-io]` section at the bottom of this file.
grafeo-engine = { version = "=0.5.44", features = ["algos", "gql"] }
grafeo-adapters = { version = "=0.5.44", features = ["gql", "algos"] }
grafeo-core = "=0.5.44"

# GPU. The CUDA version is fixed rather than read from nvcc at build time, so
# builds need no CUDA toolkit and do not depend on the machine they run on.
# cudarc loads the driver at runtime; 12.6 bindings match the committed PTX
# (ISA 8.5), which already needs a CUDA 12.5 or newer driver.
cudarc = { version = "0.19", features = ["driver", "nvrtc", "cuda-12060"] }

# PTX manifest hashing (build script and xtask)
sha2 = "0.10"

# Error handling
thiserror = "2.0"

# Python bindings
pyo3 = "0.29"

# CLI & serialization
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Testing & benchmarks
criterion = "0.8"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Inherited allows from Grafeo
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
wildcard_imports = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1

# Local development against a sibling Grafeo checkout (never commit uncommented):
# [patch.crates-io]
# grafeo-engine = { path = "../grafeo/crates/grafeo-engine" }
# grafeo-adapters = { path = "../grafeo/crates/grafeo-adapters" }
# grafeo-core = { path = "../grafeo/crates/grafeo-core" }

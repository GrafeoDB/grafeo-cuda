[workspace]
resolver = "2"
members = [
    "crates/grafeo-cuda-core",
    "crates/grafeo-cuda-algos",
    "crates/bindings/python",
]
default-members = [
    "crates/grafeo-cuda-core",
    "crates/grafeo-cuda-algos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"
repository = "https://github.com/GrafeoDB/grafeo-cuda"
authors = ["S.T. Grond"]
description = "GPU-accelerated graph algorithms for the Grafeo graph database."

[workspace.dependencies]
# Internal crates
grafeo-cuda-core = { path = "crates/grafeo-cuda-core", version = "0.1.0" }
grafeo-cuda-algos = { path = "crates/grafeo-cuda-algos", version = "0.1.0" }

# Grafeo (path for local dev, version for crates.io publish)
grafeo-engine = { path = "../grafeo/crates/grafeo-engine", version = "0.5.33", features = ["algos", "gql"] }
grafeo-adapters = { path = "../grafeo/crates/grafeo-adapters", version = "0.5.33", features = ["gql", "algos"] }
grafeo-core = { path = "../grafeo/crates/grafeo-core", version = "0.5.33" }
grafeo-common = { path = "../grafeo/crates/grafeo-common", version = "0.5.33" }

# GPU
cudarc = { version = "0.19", features = ["driver", "nvrtc", "cuda-version-from-build-system"] }

# Error handling
thiserror = "2.0"

# Python bindings
pyo3 = "0.27"

# CLI & serialization
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Testing & benchmarks
criterion = "0.8"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Inherited allows from Grafeo
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
wildcard_imports = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
codegen-units = 1

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GrafeoDB/grafeo
          path: ../grafeo
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish grafeo-cuda-core
        run: cargo publish -p grafeo-cuda-core --no-verify || echo "Already published or skipped"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for index sync
        run: sleep 30
      - name: Publish grafeo-cuda-algos
        run: cargo publish -p grafeo-cuda-algos --no-verify || echo "Already published or skipped"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true

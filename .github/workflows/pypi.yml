name: PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Wheels embed the PTX committed in crates/grafeo-cuda-algos/kernels/ptx/, so
# the hosted runners need no CUDA toolkit and every wheel carries the same
# kernels. The build fails if that PTX does not match the kernel sources; the
# explicit check below reports it before any build starts.

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check committed PTX matches the kernel sources
        run: cargo xtask check-ptx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  build-linux:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check committed PTX matches the kernel sources
        run: cargo xtask check-ptx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter -m crates/bindings/python/Cargo.toml
          manylinux: auto
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist

  build-windows:
    name: Build Windows wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check committed PTX matches the kernel sources
        run: cargo xtask check-ptx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -m crates/bindings/python/Cargo.toml
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

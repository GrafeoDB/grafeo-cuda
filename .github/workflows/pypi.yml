name: PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Build wheels on a GPU runner (nvcc required for kernel compilation)
  # PyPI for CUDA packages is typically source-distribution only,
  # since the user needs a matching CUDA toolkit at install time.
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  # Build Linux x86_64 wheel (most common deployment target)
  build-linux:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter -m crates/bindings/python/Cargo.toml
          manylinux: auto
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist

  # Build Windows x64 wheel
  build-windows:
    name: Build Windows wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -m crates/bindings/python/Cargo.toml
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist

  # Publish to PyPI
  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
